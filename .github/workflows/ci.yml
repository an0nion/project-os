name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Lint, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Stub env vars only at this step so module-level inits
        # (supabase.createClient, web-push VAPID decode, Slack Bolt App
        # construction) don't throw during page-data collection. NOT real
        # credentials — replace with GitHub Actions repo secrets if/when CI
        # needs to actually exercise integrations.
        # NODE_ENV=test bypasses V2.5's strict production env validation
        # while still exercising the build path.
        env:
          NODE_ENV: test
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_KEY: stub_anon_key_for_build_only_xxxxxxxxxxxxxxxxxxxxxx
          SUPABASE_SERVICE_KEY: eyJstubForBuildOnlyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          APP_URL: https://example.com
          APP_SECRET: stub_app_secret_for_build_only_xxxxxxxxx
          CRON_SECRET: stub_cron_secret_for_build_only_xxxxxxxxx
          COST_LOG_SECRET: stub_cost_log_secret_for_build_only_xxxxxxxxx
          ANTHROPIC_API_KEY: sk-ant-stub-anthropic-key-for-build-only
          GOOGLE_AI_API_KEY: AIzaStubGoogleAIKeyForBuildOnly
          DEEPSEEK_API_KEY: sk-stub-deepseek-key-for-build-only
          # Real-format VAPID public key (65-byte P-256 EC point, base64url)
          # so web-push's startup decode check passes. Throwaway test pair.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BO5sWjHrQEKYO2_jklr3QHJ8qHHAtAh5q4vmJU0AuP8Ji0HAvfu4bMx30QjhRT8mLzS8gSPKCH3Xrm7uyJxh3fU
          VAPID_PRIVATE_KEY: cQjBNZAtVW9xPjpIN5BfjUOJzoHFPlXRfKrIGJlZqqA
          VAPID_EMAIL: mailto:ci@example.com
          APP_TIMEZONE: Australia/Melbourne
          SLACK_BOT_TOKEN: xoxb-stub-bot-token-for-build-only
          SLACK_APP_TOKEN: xapp-1-stub-app-token-for-build-only-AAAAAAA
          SLACK_USER_ID: U00STUB000
          TAVILY_API_KEY: tvly-stub-tavily-key-for-build-only
        run: npm run build

      - name: Test
        # Tests are self-contained: each .test.mjs sets the env it needs and
        # mocks external deps. NO build-step stubs leak into this step — those
        # would clobber test-local values (e.g. tests/auth.test.mjs uses
        # `process.env.APP_SECRET ||= 'test-app-secret'`).
        # Bash globstar (**) is off by default; tests are flat at tests/ top
        # level so single-* glob is sufficient.
        run: node --test tests/*.test.mjs
